<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="light dark">
<title>เช็คราคาประเมิน</title>
<meta name="description" content="กดเลือกสินค้า รุ่น สภาพ แล้วได้ราคารับ–ราคาขายทันที">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231260c9'/><text x='50' y='72' font-size='58' font-weight='bold' fill='%23fff' text-anchor='middle' font-family='sans-serif'>฿</text></svg>">
<style>
:root{
  color-scheme: light;
  --brand:#1260c9; --brand-d:#0a3f8a; --brand-l:#2a78d6;
  --yellow:#ffd21e;
  --page:#eef2f8; --surface:#ffffff; --surface-2:#f3f5f9; --surface-3:#e8edf5;
  --ink:#0d1220; --ink-2:#4b5568; --ink-3:#8a93a4;
  --grid:#e4e9f1; --axis:#c6cedc; --border:rgba(13,18,32,.09); --border-s:rgba(13,18,32,.16);
  --buy:#1260c9; --sell:#eb6834;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --good-ink:#068006; --crit-ink:#b83232; --warn-ink:#8a5d00;
  --good-bg:rgba(12,163,12,.11); --warn-bg:rgba(250,178,25,.18); --crit-bg:rgba(208,59,59,.10);
  --sh:0 1px 2px rgba(13,18,32,.05),0 6px 18px -10px rgba(13,18,32,.22);
  --sh-lg:0 2px 6px rgba(13,18,32,.06),0 16px 36px -18px rgba(13,18,32,.35);
  --r:16px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --brand:#2a78d6; --brand-d:#0b2a52; --brand-l:#3987e5;
  --page:#0b0e14; --surface:#161b24; --surface-2:#1f2430; --surface-3:#2a3140;
  --ink:#fff; --ink-2:#b9c2d1; --ink-3:#7e879a;
  --grid:#242a36; --axis:#333c4c; --border:rgba(255,255,255,.09); --border-s:rgba(255,255,255,.18);
  --buy:#3987e5; --sell:#d95926;
  --good-ink:#22c55e; --crit-ink:#f87171; --warn-ink:#fbbf24;
  --good-bg:rgba(34,197,94,.14); --warn-bg:rgba(251,191,36,.14); --crit-bg:rgba(248,113,113,.14);
  --sh:0 1px 2px rgba(0,0,0,.5),0 6px 18px -10px rgba(0,0,0,.7);
  --sh-lg:0 2px 6px rgba(0,0,0,.5),0 16px 36px -18px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --brand:#2a78d6; --brand-d:#0b2a52; --brand-l:#3987e5;
  --page:#0b0e14; --surface:#161b24; --surface-2:#1f2430; --surface-3:#2a3140;
  --ink:#fff; --ink-2:#b9c2d1; --ink-3:#7e879a;
  --grid:#242a36; --axis:#333c4c; --border:rgba(255,255,255,.09); --border-s:rgba(255,255,255,.18);
  --buy:#3987e5; --sell:#d95926;
  --good-ink:#22c55e; --crit-ink:#f87171; --warn-ink:#fbbf24;
  --good-bg:rgba(34,197,94,.14); --warn-bg:rgba(251,191,36,.14); --crit-bg:rgba(248,113,113,.14);
  --sh:0 1px 2px rgba(0,0,0,.5),0 6px 18px -10px rgba(0,0,0,.7);
  --sh-lg:0 2px 6px rgba(0,0,0,.5),0 16px 36px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);
  font-family:"Prompt",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
  font-size:14.5px;line-height:1.55;letter-spacing:.005em;-webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}

/* ================= HERO ================= */
.hero{background:linear-gradient(155deg,var(--brand-l),var(--brand) 42%,var(--brand-d));
  color:#fff;border-radius:0 0 26px 26px;padding:calc(env(safe-area-inset-top) + 14px) 0 20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{content:"";position:absolute;left:-50px;bottom:-110px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.06)}
.hin{max-width:900px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
.hrow{display:flex;align-items:center;gap:12px}
.hback{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;color:#fff;flex:0 0 auto}
.hback:active{background:rgba(255,255,255,.3)}
.hbrand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:0;flex:1;min-width:0}
.hbrand .mark{width:30px;height:30px;border-radius:9px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:900;font-size:16px}
.htitle{font-size:17px;font-weight:700;letter-spacing:0;line-height:1.28;margin:0;flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hsub{font-size:12.5px;opacity:.82;margin-top:2px;font-weight:500}
.hicon{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;color:#fff;flex:0 0 auto}
.crumb{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;opacity:.9}
.crumb button{background:rgba(255,255,255,.16);border-radius:8px;padding:4px 10px;color:#fff;font-weight:600}
.crumb span{padding:4px 2px;opacity:.6}
.hstat{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hstat div{background:rgba(255,255,255,.15);border-radius:11px;padding:7px 12px;font-size:12.5px;font-weight:600}
.hstat b{font-size:15px;font-variant-numeric:tabular-nums}

/* search overlay */
.sbar{margin-top:13px;position:relative;display:flex;align-items:center}
.sbar svg{position:absolute;left:13px;width:18px;height:18px;color:var(--ink-3);pointer-events:none}
#q,#cq{width:100%;padding:12px 40px 12px 40px;border-radius:13px;border:0;background:#fff;color:#0d1220;outline:none;font-size:16px;box-shadow:0 4px 14px -6px rgba(0,0,0,.35)}
#q::placeholder,#cq::placeholder{color:#8a93a4}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration,#cq::-webkit-search-cancel-button,#cq::-webkit-search-decoration{-webkit-appearance:none;display:none}
.clearq{position:absolute;right:8px;color:var(--ink-3);font-size:17px;padding:5px 9px;border-radius:9px;display:none}
.clearq.on{display:block}

/* ================= COMMON ================= */
main{padding:16px 0 20px}
h2.sec{font-size:13.5px;font-weight:800;color:var(--ink-2);margin:20px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec:first-child{margin-top:4px}
h2.sec::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--brand)}
h2.sec .c{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:600}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.muted{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.b-good{background:var(--good-bg);color:var(--good-ink)}
.chip.b-warn{background:var(--warn-bg);color:var(--warn-ink)}
.chip.b-crit{background:var(--crit-bg);color:var(--crit-ink)}

/* ---------- ปุ่มหมวดหมู่ (หน้าแรก) ---------- */
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:9px;min-width:0}
.catgrid>*{min-width:0}
.cat{background:var(--surface);border-radius:var(--r);padding:12px 7px 10px;display:grid;justify-items:center;gap:6px;
  box-shadow:var(--sh);border:1px solid var(--border);transition:transform .11s;align-content:start}
.cat:active{transform:scale(.96)}
.cat .nm{font-size:12.5px;font-weight:600;text-align:center;line-height:1.28;letter-spacing:0;min-height:2.56em;display:flex;align-items:center}

/* ทางลัดใช้บ่อย */
.hotrow{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.hotrow::-webkit-scrollbar{display:none}
.hot{flex:0 0 auto;width:152px;background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:11px 12px;box-shadow:var(--sh);text-align:left;scroll-snap-align:start;transition:transform .11s}
.hot:active{transform:scale(.96)}
.hot .hi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;margin-bottom:7px}
.hot .hn{display:block;font-size:13px;font-weight:600;line-height:1.3;letter-spacing:0;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.6em}
.hot .hp{display:block;font-size:13.5px;font-weight:800;color:var(--buy);margin-top:5px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .ct{font-size:11px;color:var(--ink-3);font-weight:600}

.pick.stack{flex-wrap:wrap;row-gap:6px}
.pick.stack .t{flex:1 1 calc(100% - 52px)}
.pick.stack .n{-webkit-line-clamp:4;overflow-wrap:anywhere;font-size:14.5px}
.pick.stack .p{flex:1;text-align:left;margin-left:50px;display:flex;align-items:baseline;gap:8px}
.pick.stack .p br{display:none}
.pick.stack .arw{order:2}
.pick.stack .p .b{font-size:17px}
@media(max-width:560px){
  .pick{flex-wrap:wrap;row-gap:6px}
  .pick .t{flex:1 1 calc(100% - 52px)}
  .pick .n{-webkit-line-clamp:4;overflow-wrap:anywhere;font-size:14.5px}
  .pick .p{flex:1;text-align:left;margin-left:50px;display:flex;align-items:baseline;gap:8px}
  .pick .p br{display:none}
  .pick .arw{order:2}
  .pick .p .b{font-size:17px}
}
/* ---------- ไอคอนกล่องสี ---------- */
.ibox{--c:var(--brand);width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--c);flex:0 0 auto;
  background:linear-gradient(145deg,color-mix(in srgb,var(--c) 22%,var(--surface)),color-mix(in srgb,var(--c) 8%,var(--surface)));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 18%,transparent)}
.ibox svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- แถบแบรนด์ / หัวกลุ่ม / สลับการเรียง ---------- */
.brandbar{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none;
  position:sticky;top:0;z-index:15;background:linear-gradient(var(--page) 82%,transparent)}
.brandbar::-webkit-scrollbar{display:none}
.bchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--border-s);border-radius:999px;
  padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:.12s;box-shadow:var(--sh)}
.bchip .bn{font-size:11px;font-weight:600;color:var(--ink-3);background:var(--surface-2);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.bchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.bchip[aria-pressed="true"] .bn{background:rgba(255,255,255,.22);color:#fff}
.bchip:active{transform:scale(.96)}
.sec2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-3);transition:.12s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:var(--sh)}
.bhead{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.bhead:first-child{margin-top:0}
.bhead::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}
.bhead .c{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-weight:500}
#app.in{animation:fadein .22s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#app.in{animation:none}}
.pick:hover,.cat:hover,.hot:hover,.vpick:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--border))}

/* ---------- ปุ่มรุ่น ---------- */
.list{display:grid;gap:9px;min-width:0}
.list>*{min-width:0;max-width:100%}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;padding:13px 14px;box-shadow:var(--sh);transition:transform .11s}
.pick:active{transform:scale(.985)}
.pick .t{flex:1;min-width:0}
.pick .n{font-weight:600;font-size:15px;letter-spacing:0;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
.pick .m{display:flex;gap:5px;align-items:center;margin-top:3px;font-size:12px;font-weight:500;color:var(--ink-3);flex-wrap:wrap;line-height:1.35}
.pick .m .dot{opacity:.5}
.pick .m .f{font-weight:700}
.pick .m .f.b-good{color:var(--good-ink)}
.pick .m .f.b-warn{color:var(--warn-ink)}
.pick .m .f.b-crit{color:var(--crit-ink)}
.pick .p{text-align:right;white-space:nowrap;flex:0 0 auto}
.pick .p .b{font-size:16px;font-weight:700;color:var(--buy);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.pick .p .s{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pick .arw{color:var(--ink-3);flex:0 0 auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;min-width:0}
.grid2>*{min-width:0}
.vpick{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px;box-shadow:var(--sh);text-align:left;transition:transform .11s}
.vpick:active{transform:scale(.97)}
.vpick .n{font-weight:700;font-size:15px}
.vpick .b{font-size:17px;font-weight:800;color:var(--buy);margin-top:6px;font-variant-numeric:tabular-nums}
.vpick .s{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---------- ตัวเลือกสภาพ (chips) ---------- */
.optblk{margin-top:14px}
.optlab{font-size:13px;font-weight:800;color:var(--ink-2);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.optlab .hint{font-weight:600;color:var(--ink-3);font-size:11.5px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:var(--surface);border:1.5px solid var(--border-s);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:700;color:var(--ink-2);transition:.12s;line-height:1.25}
.opt:active{transform:scale(.96)}
.opt[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px -4px color-mix(in srgb,var(--brand) 60%,transparent)}
.opt .sub{display:block;font-size:11px;font-weight:600;opacity:.7;margin-top:1px}
.opt.sm{padding:7px 12px;font-size:13px}
.opt.na{opacity:.35}

/* ---------- การ์ดผลลัพธ์ ---------- */
.res{background:linear-gradient(150deg,var(--brand-l),var(--brand) 55%,var(--brand-d));border-radius:20px;padding:16px 18px;color:#fff;box-shadow:var(--sh-lg);position:sticky;top:8px;z-index:20;overflow:hidden}
.res::after{content:"";position:absolute;right:-50px;top:-70px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.res .lab{font-size:12.5px;font-weight:700;opacity:.85}
.res .big{font-size:clamp(27px,8.2vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.12;margin:3px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.res .u{font-size:16px;font-weight:700;opacity:.8}
.res .two{display:flex;gap:10px;margin-top:14px;position:relative;z-index:1}
.res .two>div{flex:1;background:rgba(255,255,255,.16);border-radius:13px;padding:10px 12px}
.res .two .k{font-size:11.5px;opacity:.85;font-weight:700}
.res .two .v{font-size:clamp(15px,4.4vw,18px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:1px}
.res .foot{margin-top:13px;font-size:12px;opacity:.85;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:relative;z-index:1}
.res .foot .pill{background:rgba(255,255,255,.18);border-radius:8px;padding:3px 9px;font-weight:700}
.resbtn{display:flex;gap:8px;margin-top:13px;position:relative;z-index:1}
.resbtn button{flex:1;background:#fff;color:var(--brand);font-weight:800;padding:11px;border-radius:13px;font-size:14px}
.resbtn button.g{background:rgba(255,255,255,.2);color:#fff}
.resbtn button:active{transform:scale(.97)}

.banner{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:13px;font-size:13px;line-height:1.5;margin:12px 0}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink)}
.banner.crit{background:var(--crit-bg);color:var(--crit-ink)}
.banner.info{background:var(--surface-2);color:var(--ink-2)}
.banner b{font-weight:800}

/* ---------- tiles / table / chart ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.tile{padding:13px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh)}
.tile .lab{font-size:11.5px;font-weight:700;color:var(--ink-3);margin-bottom:4px}
.tile .val{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.2;white-space:nowrap}
.tile .val.sm{font-size:17px;letter-spacing:-.015em}
.tile .foot{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.chartbox{position:relative;padding:14px 12px 6px;margin-top:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);font-weight:700;margin-bottom:4px;padding:0 4px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border-s);border-radius:11px;padding:8px 11px;font-size:12.5px;box-shadow:var(--sh-lg);opacity:0;transition:opacity .1s;z-index:10;min-width:128px}
.tip .t-d{color:var(--ink-3);font-size:11.5px;margin-bottom:3px}
.tip .t-r{display:flex;justify-content:space-between;gap:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.03em;color:var(--ink-3);font-weight:800;padding:9px 10px;border-bottom:1px solid var(--grid);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.detail td{background:var(--surface-2);font-size:12.5px;color:var(--ink-2);white-space:pre-wrap}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:600px){
  .tbl th:nth-child(n+4),.tbl tr[data-i] td:nth-child(n+4):not(:nth-child(4)){display:none}
  .tbl th:nth-child(4),.tbl tr[data-i] td:nth-child(4){display:table-cell}
  .tbl th:nth-child(n+5),.tbl tr[data-i] td:nth-child(n+5){display:none}
  .tbl tbody tr[data-i]::after{content:""}
}
details.more{margin-top:14px}
details.more>summary{list-style:none;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:13px;
  padding:12px 15px;font-weight:700;font-size:14px;color:var(--ink-2);box-shadow:var(--sh);display:flex;align-items:center;gap:8px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"▾";margin-left:auto;color:var(--ink-3)}
details.more[open]>summary::after{content:"▴"}

/* ---------- import ---------- */
.drop{border:2px dashed var(--border-s);border-radius:var(--r);padding:34px 18px;text-align:center;background:var(--surface);transition:.15s}
.drop.over{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 7%,var(--surface))}
.btn{background:var(--brand);color:#fff;font-weight:800;padding:12px 22px;border-radius:13px;font-size:14.5px}
.btn.ghost{background:var(--surface);color:var(--ink-2);border:1.5px solid var(--border-s)}
.btn:active{transform:scale(.97)}
.steps{counter-reset:s;display:grid;gap:11px;margin:12px 0 0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:25px 1fr;gap:11px;font-size:13.8px;line-height:1.55;color:var(--ink-2)}
.steps li>div{min-width:0}
.steps li::before{content:counter(s);background:var(--brand);color:#fff;border-radius:8px;width:25px;height:25px;display:grid;place-items:center;font-size:12px;font-weight:800}
code{background:var(--surface-2);padding:1.5px 6px;border-radius:5px;font-size:.9em;font-family:ui-monospace,Menlo,Consolas,monospace}
.empty{text-align:center;padding:46px 20px;color:var(--ink-3)}
.empty .big{font-size:36px;margin-bottom:8px}
.loading{text-align:center;padding:70px 20px;color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h)}
.nav button{display:grid;justify-items:center;align-content:center;gap:3px;color:var(--ink-3);font-size:11px;font-weight:700}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{color:var(--brand)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 22px);background:var(--ink);color:var(--page);
  padding:11px 18px;border-radius:12px;font-size:14px;font-weight:700;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

/* ==================================================================
   CLEAN TYPOGRAPHY — น้ำหนักเบา สีเทาสม่ำเสมอ เหมือนตารางระบบงาน
   ================================================================== */
body{font-weight:400;font-size:14px;color:#2b3340}
:root{--ink:#2b3340;--ink-2:#5b6675;--ink-3:#8b95a5;--page:#f4f6f9;--border:rgba(30,40,60,.08);--border-s:rgba(30,40,60,.14);
  --sh:0 1px 2px rgba(20,30,50,.05);--sh-lg:0 4px 14px -6px rgba(20,30,50,.18)}
b,strong{font-weight:600}

/* hero: สีน้ำเงินเรียบ ไม่มีวงกลม */
.hero{background:var(--brand);border-radius:0;padding-bottom:18px}
.hero::before,.hero::after{display:none}
.hbrand{font-weight:500;font-size:17px}
.hbrand .mark{font-weight:600}
.htitle{font-weight:500;font-size:17px}
.hsub{font-weight:400;opacity:.8}
.crumb{font-weight:400}
.crumb button{font-weight:400;background:rgba(255,255,255,.14)}
.hback,.hicon{background:rgba(255,255,255,.14)}
#q,#cq{box-shadow:none;font-size:14px;padding:11px 40px;border-radius:8px;font-weight:400}

/* หัวข้อ */
h2.sec{font-size:13px;font-weight:500;color:var(--ink-2)}
h2.sec::before{display:none}
h2.sec .c{font-weight:400}
.card{border-radius:10px}

/* หน้าแรก: หมวดหมู่ */
.catgrid{gap:10px}
@media(min-width:700px){.catgrid{grid-template-columns:repeat(5,1fr)}}
.cat{border-radius:10px;padding:14px 8px 12px;gap:8px}
.cat .nm{font-weight:500;font-size:13px}
.cat .ct{font-weight:400}
.ibox{border-radius:12px;box-shadow:none;background:color-mix(in srgb,var(--c) 10%,var(--surface))}

/* รูปสินค้าในกล่องหมวด */
.cimg{width:100%;height:92px;border-radius:10px 10px 0 0;background:#fff;display:block;overflow:hidden}
.cimg img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.cat{padding:0 0 12px;overflow:hidden;justify-items:stretch;text-align:center}
.cat .nm{justify-content:center;width:100%;padding:0 8px}
.cat .ibox{width:100%;height:92px;border-radius:0;margin:0 0 4px}
.cat .ibox svg{width:30px;height:30px}
@media(min-width:700px){.cimg,.cat .ibox{height:104px}}

/* ประเภทย่อย + สไลเดอร์แบต */
.brandbar.sub{position:static;padding-top:0;margin-top:-4px}
.brandbar .bl{align-self:center;font-size:12px;color:var(--ink-3);padding-right:2px;white-space:nowrap}
.brange{display:flex;align-items:center;gap:10px;flex:1 1 260px;min-width:220px;padding:4px 6px}
.brange .bl{font-size:13px;color:var(--ink-2);white-space:nowrap}
.brange.on .bl{color:var(--brand);font-weight:500}
.brange input[type=range]{flex:1;min-width:120px;accent-color:var(--brand);height:28px}
.brange .bnum{display:flex;align-items:center;gap:3px;font-size:13px;color:var(--ink-2)}
.brange .bnum input{width:58px;padding:6px 8px;border:1px solid var(--border-s);border-radius:8px;background:var(--surface);text-align:center;font-size:14px}
.brange.on .bnum input{border-color:var(--brand);color:var(--brand);font-weight:500}
.hist .tbl{font-size:13px}

/* กล่องสถิติสี + ป้ายช่วงเวลาในตาราง */
.tile.t-green,.tile.t-red,.tile.t-blue{color:#fff;border:0}
.tile.t-green{background:#3cbc6b}
.tile.t-red{background:#e8514f}
.tile.t-blue{background:#3d8ef0}
.tile.t-green .lab,.tile.t-red .lab,.tile.t-blue .lab,.tile.t-green .foot,.tile.t-red .foot,.tile.t-blue .foot{color:rgba(255,255,255,.85)}
.agebadge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:6px;margin-top:3px;font-weight:500;line-height:1.5;color:#fff}
.agebadge.ok{background:#22c58b}
.agebadge.mid{background:#f5b323}
.agebadge.old{background:#ef4b4b}

/* ราคาขายจริง */
.res.sellres{background:#c2410c}
.res .two .sold{cursor:pointer;background:rgba(255,255,255,.22)}
.res .two .sold:hover{background:rgba(255,255,255,.3)}
.chip.ch-FB{background:#e7f0ff;color:#1a56c9}.chip.ch-LINE{background:#e3f7e8;color:#1b7f3b}.chip.ch-Shopee{background:#ffe9df;color:#c2410c}
.chip.ch-Kaidee{background:#fff3d6;color:#8a5a00}.chip.ch-IG{background:#fbe4f3;color:#a3157a}.chip.ch-Lazada{background:#e9e4ff;color:#4b2fbf}
.stbl td{font-size:13px}
.navin{grid-template-columns:repeat(4,1fr)}

/* แถบแบรนด์ / สลับการเรียง */
.bchip{font-weight:400;font-size:13px;border-radius:8px;box-shadow:none;border-color:var(--border-s);padding:6px 12px}
.bchip .bn{font-weight:400}
.seg{border-radius:8px}
.seg button{font-weight:400;border-radius:6px}
.seg button[aria-pressed="true"]{font-weight:500}

/* ---------- ตารางรุ่น ---------- */
.table{display:grid;gap:6px;margin-bottom:8px}
.thead,.trow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.8fr) 110px 100px 120px 90px 20px;gap:12px;align-items:center}
.table.nocode .thead,.table.nocode .trow,.thead.nocode{grid-template-columns:minmax(0,2.6fr) 0 110px 100px 120px 110px 20px}
.thead{padding:4px 16px 8px;font-size:12px;color:var(--ink-3);font-weight:400}
.trow{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0 16px;height:52px;text-align:left;
  font-size:13.5px;font-weight:400;color:var(--ink);transition:border-color .12s,box-shadow .12s;box-shadow:var(--sh)}
.trow:hover{border-color:color-mix(in srgb,var(--brand) 55%,var(--border));box-shadow:0 0 0 1px color-mix(in srgb,var(--brand) 55%,transparent) inset}
.trow:active{background:var(--surface-2)}
.trow>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-name{font-weight:500}
.c-code{color:var(--ink-2);font-family:"Prompt",ui-monospace,monospace;letter-spacing:.02em}
.c-code-m{display:none}
.c-buy{color:var(--buy);font-weight:500}
.c-sell{color:var(--ink-2)}
.c-sell .lab{display:none}
.c-age{color:var(--ink-2);display:flex;align-items:center;gap:7px}
.c-n{color:var(--ink-3);font-size:12.5px}
.c-arw{color:var(--ink-3);font-size:18px;line-height:1;text-align:right}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:0 0 auto;display:inline-block}
.dot.ok{background:#2fb344}.dot.mid{background:#f5a623}.dot.old{background:#e5484d}
.bhead{margin:12px 16px 4px;font-size:12px;font-weight:500;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.bhead::before{display:none}
.bhead .c{text-transform:none;letter-spacing:0;font-weight:400}
@media(max-width:700px){
  .thead{display:none}
  .trow{grid-template-columns:minmax(0,1fr) auto 14px;grid-template-rows:auto auto;gap:2px 10px;height:auto;padding:11px 14px;row-gap:3px}
  .table.nocode .trow{grid-template-columns:minmax(0,1fr) auto 14px}
  .c-name{grid-column:1;grid-row:1;white-space:normal;display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline;line-height:1.35}
  .c-code{display:none}
  .c-code-m{display:inline;color:var(--ink-2);font-weight:400;letter-spacing:.02em}
  .c-buy{grid-column:2;grid-row:1;text-align:right;font-size:14px}
  .c-arw{grid-column:3;grid-row:1/3;text-align:right}
  .c-sell{grid-column:1;grid-row:2;font-size:12px;color:var(--ink-3)}
  .c-sell .lab{display:inline}
  .c-age{grid-column:2;grid-row:2;font-size:12px;justify-content:flex-end;color:var(--ink-3)}
  .c-n{display:none}
}

/* หน้าประเมินราคา */
.res{border-radius:12px;background:var(--brand);box-shadow:var(--sh-lg)}
.res::after{display:none}
.res .lab{font-weight:400}
.res .big{font-weight:600;font-size:clamp(26px,7.5vw,34px);letter-spacing:-.01em}
.res .two>div{border-radius:8px}
.res .two .k{font-weight:400}
.res .two .v{font-weight:500}
.res .foot .pill{font-weight:400;border-radius:6px}
.resbtn button{font-weight:500;border-radius:8px}
.optlab{font-weight:500;font-size:12.5px;color:var(--ink-2)}
.optlab .hint{font-weight:400}
.opt{font-weight:400;border-radius:8px;border-width:1px;padding:8px 14px;font-size:13.5px}
.opt[aria-pressed="true"]{font-weight:500;box-shadow:none}
.opt .sub{font-weight:400}
.banner{border-radius:8px;font-weight:400}
.banner b{font-weight:500}
.tile{border-radius:10px}
.tile .lab{font-weight:400}
.tile .val{font-weight:500;font-size:20px}
.tbl th{font-weight:500;letter-spacing:.02em;text-transform:none}
.tbl td{font-weight:400}
details.more>summary{font-weight:400;border-radius:8px}
.legend{font-weight:400}
.chip{font-weight:400}
.btn{font-weight:500;border-radius:8px}
.nav button{font-weight:400}
.nav button[aria-selected="true"]{font-weight:500}
.steps li::before{font-weight:500}
.hbrand .mark{border-radius:8px}
</style>
</head>
<body>
<header class="hero" id="hero"></header>
<main><div class="wrap" id="app"><div class="loading">กำลังโหลดข้อมูล…</div></div></main>
<nav class="nav"><div class="navin" id="nav"></div></nav>
<div class="toast" id="toast"></div>
<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
